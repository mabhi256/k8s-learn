# https://kind.sigs.k8s.io/docs/user/configuration/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: demo
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
- role: control-plane
  image: kindest/node:v1.32.2
  # extraPortMappings:
  # - containerPort: 30080   # NodePort kept for s2/s3 reference
  #   hostPort: 30080
# workers carry stateful workloads (s5) so anti-affinity can spread them
- role: worker
  image: kindest/node:v1.32.2
# Commented out to reduce RAM usage (~150MB saved); uncomment if you need
# multi-node scheduling (anti-affinity, topology spread, etc.)
# - role: worker
#   image: kindest/node:v1.32.2