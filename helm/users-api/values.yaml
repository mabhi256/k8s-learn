image:
  repository: users-api
  tag: local-v3
  pullPolicy: Never

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# resources:
#   requests:
#     cpu: 100m
#     memory: 128Mi
#   limits:
#     cpu: 200m
#     memory: 256Mi

# can also write like this
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 200m, memory: 256Mi }

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 70
  customMetric:
    enabled: true
    name: http_requests_per_second
    targetAverageValue: "10"

env:
  LOG_LEVEL: "debug"
  NOTIFY_HOST: notify-api
  NOTIFY_PORT: "50051"
  DB_HOST: postgres-0.postgres-headless
  DB_PORT: "5432"
  DB_NAME: appdb
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.lgtm.svc:4317"
  OTEL_SERVICE_NAME: "users-api"

secrets:
  DB_USER: "appuser"
  DB_PASSWORD: "secret"

serviceMonitor:
  enabled: true
  namespace: lgtm

vpa:
  enabled: true
  updateMode: InPlaceOrRecreate
  minAllowed:
    cpu: 25m
    memory: 64Mi
  maxAllowed:
    cpu: 500m
    memory: 512Mi
  controlledResources:
    - cpu
    - memory

version: v1

canary:
  enabled: false
  version: v2
  replicaCount: 1
  image:
    repository: users-api
    tag: local-v3
    pullPolicy: Never

istio:
  peerAuthentication:
    enabled: false
    mode: STRICT
  destinationRule:
    enabled: false
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  virtualService:
    enabled: false
    stableWeight: 95
    canaryWeight: 5
    retries:
      attempts: 2
      retryOn: 5xx
    timeout: 5s

nameOverride: ""
fullnameOverride: ""