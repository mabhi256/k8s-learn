image:
  repository: frontend
  tag: local-v1
  pullPolicy: Never

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests: { cpu: 50m, memory: 32Mi }
  limits:   { cpu: 100m, memory: 64Mi }

env: {}

serviceMonitor:
  enabled: false
  namespace: lgtm

nameOverride: ""
fullnameOverride: ""
