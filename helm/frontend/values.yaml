image:
  repository: frontend
  tag: local-v1
  pullPolicy: Never

# Reduced to save RAM; set back to 2 for multi-replica testing
replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests: { cpu: 50m, memory: 32Mi }
  limits:   { cpu: 100m, memory: 64Mi }

env: {}

serviceMonitor:
  enabled: false
  namespace: lgtm

nameOverride: ""
fullnameOverride: ""
