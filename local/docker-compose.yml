services:
  users-api:
    build: ../apps/users-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: secret
      DB_NAME: appdb
      NOTIFY_HOST: notify-api
      NOTIFY_PORT: 50051
    depends_on:
      postgres:
        condition: service_healthy
      notify-api:
        condition: service_started
    restart: on-failure

  notify-api:
    build: ../apps/notify-api
    ports:
      - "50051:50051"
    restart: on-failure

  frontend:
    build: ../apps/frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - users-api

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # postgres auto-runs any .sql file here on first start
      - ../apps/users-api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "appuser", "-d", "appdb"]
      interval: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  