apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: users-app
  #labels:
  #  app.kubernetes.io/name: users-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: demo.local
    http:
      paths:
      - pathType: ImplementationSpecific
        path: /api(/|$)(.*)
        backend:
          service:
            name: users-api
            port: 
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: frontend
            port: 
              number: 80
