apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    app: postgres
spec:
  # clusterIP: None makes this a "headless" Service: DNS returns
  # one A record per Pod instead of a single VIP. That's what gives
  # us postgres-0.postgres-headless.<ns>.svc.cluster.local.
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
