apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres-headless   # must match the headless Service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: postgres
              topologyKey: kubernetes.io/hostname
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
          - name: postgres
            containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret 
          volumeMounts:
          - name: pgdata
            mountPath: /var/lib/postgresql/data/pgdata
          - name: init-sql
            mountPath: /docker-entrypoint-initdb.d
            readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 150Mi
            limits:
              cpu: 200m
              memory: 300Mi
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "appdb"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "appdb"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "appdb"]
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: pgdata
      labels:
        app: postgres
    spec:
      accessModes: [ "ReadWriteOnce" ]
      # No storageClassName: kind's default `standard` (local-path-provisioner) takes it.
      resources:
        requests:
          storage: 1Gi
