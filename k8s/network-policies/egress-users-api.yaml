apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: users-api-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: users-api
  policyTypes:
    - Egress
  egress:
    # DNS (CoreDNS in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
    # notify-api (gRPC)
    - to:
        - podSelector:
            matchLabels:
              app: notify-api
      ports:
        - protocol: TCP
          port: 50051