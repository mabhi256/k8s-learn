apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: users-api
        - podSelector:
            matchLabels:
              app: db-seed
        - podSelector:
            matchLabels:
              app: db-backup
      ports:
        - port: 5432
          protocol: TCP