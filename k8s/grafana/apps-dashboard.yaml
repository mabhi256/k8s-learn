apiVersion: v1
kind: ConfigMap
metadata:
  name: apps-logs-traces-dashboard
  namespace: lgtm
  labels:
    grafana_dashboard: "1"
data:
  apps-logs-traces.json: |
    {
      "title": "Apps – Logs & Traces",
      "uid": "apps-logs-traces",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "tags": ["apps", "logs", "traces"],
      "templating": {
        "list": [
          {
            "name": "app",
            "label": "App",
            "type": "custom",
            "query": "notify-api,users-api",
            "current": { "value": "users-api", "text": "users-api" },
            "options": [
              { "value": "users-api", "text": "users-api", "selected": true },
              { "value": "notify-api", "text": "notify-api", "selected": false }
            ],
            "includeAll": false,
            "multi": false,
            "hide": 0
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": {
              "label": "pod",
              "refId": "StandardVariableQuery",
              "stream": "{app=\"$app\"}",
              "type": 1
            },
            "current": {},
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": false,
            "hide": 0
          },
          {
            "name": "method",
            "label": "Method",
            "type": "custom",
            "query": ".*,GET,PUT,POST,PATCH",
            "current": { "value": ".*", "text": "All" },
            "options": [
              { "value": ".*", "text": "All",   "selected": true  },
              { "value": "GET",   "text": "GET",   "selected": false },
              { "value": "PUT",   "text": "PUT",   "selected": false },
              { "value": "POST",  "text": "POST",  "selected": false },
              { "value": "PATCH", "text": "PATCH", "selected": false }
            ],
            "includeAll": false,
            "multi": false,
            "hide": 0
          },
          {
            "name": "level",
            "label": "Level",
            "type": "custom",
            "query": ".*,info,debug,warn,error",
            "current": { "value": ".*", "text": "All" },
            "options": [
              { "value": ".*",    "text": "All",   "selected": true  },
              { "value": "info",  "text": "info",  "selected": false },
              { "value": "debug", "text": "debug", "selected": false },
              { "value": "warn",  "text": "warn",  "selected": false },
              { "value": "error", "text": "error", "selected": false }
            ],
            "includeAll": false,
            "multi": false,
            "hide": 0
          },
          {
            "name": "path",
            "label": "Path",
            "type": "textbox",
            "query": "",
            "current": { "value": "", "text": "" },
            "hide": 0
          },
          {
            "name": "protocol",
            "label": "Protocol",
            "type": "custom",
            "query": ".*,http,grpc",
            "current": { "value": ".*", "text": "All" },
            "options": [
              { "value": ".*",   "text": "All",  "selected": true  },
              { "value": "http", "text": "HTTP", "selected": false },
              { "value": "grpc", "text": "gRPC", "selected": false }
            ],
            "includeAll": false,
            "multi": false,
            "hide": 0
          },
          {
            "name": "keyword",
            "label": "Keyword",
            "type": "textbox",
            "query": "",
            "current": { "value": "", "text": "" },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "$app logs",
          "gridPos": { "h": 22, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false,
            "prettifyLogMessage": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{app=\"$app\", pod=~\"$pod\"} | json | level=~\"$level\" | protocol=~\"$protocol\" | line_format \"{{if .direction}}{{if eq .direction \\\"recv\\\"}}\\u2190 recv{{else}}\\u2192 send{{end}} {{.method}} | {{.status}} | {{.ms}}ms | trace={{.trace_id}}\\n\\u001b[2;37m{{__line__}}\\u001b[0m{{else if .req_method}}{{.req_method}} {{.req_url}} \\u2192 {{if eq (substr 0 1 .res_statusCode) \\\"2\\\"}}\\u001b[32m{{.res_statusCode}}\\u001b[0m{{else if eq (substr 0 1 .res_statusCode) \\\"4\\\"}}\\u001b[33m{{.res_statusCode}}\\u001b[0m{{else if eq (substr 0 1 .res_statusCode) \\\"5\\\"}}\\u001b[31m{{.res_statusCode}}\\u001b[0m{{else}}{{.res_statusCode}}{{end}} | {{.responseTime}}ms | trace={{.trace_id}}\\n\\u001b[2;37m{{__line__}}\\u001b[0m{{else}}{{.msg}}{{if .trace_id}} | trace={{.trace_id}}{{end}}\\n\\u001b[2;37m{{__line__}}\\u001b[0m{{end}}\""
            }
          ]
        }
      ]
    }
