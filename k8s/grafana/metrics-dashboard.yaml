apiVersion: v1
kind: ConfigMap
metadata:
  name: apps-metrics-dashboard
  namespace: lgtm
  labels:
    grafana_dashboard: "1"
data:
  apps-metrics.json: |
    {
      "title": "Apps – Metrics",
      "uid": "apps-metrics",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "tags": ["apps", "metrics"],
      "templating": {
        "list": [
          {
            "name": "job",
            "label": "Job",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values({__name__=~\"http_requests_total|grpc_requests_total\"}, job)",
            "current": {},
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "multi": false,
            "hide": 0
          },
          {
            "name": "version",
            "label": "Version",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(istio_requests_total{destination_app=\"users-api\"}, destination_version)",
            "current": {},
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate (RPS)",
          "description": "Total req/s (from the app's own counter) plus a line per Istio destination_version. Use the Version selector to choose which versions to show. The per-version lines come from the Envoy sidecar (istio_requests_total) and only appear once Alloy scrapes the sidecars.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{job=\"$job\"}[1m]))",
              "legendFormat": "total"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (destination_version) (rate(istio_requests_total{reporter=\"destination\", destination_app=\"users-api\", destination_version=~\"$version\"}[1m]))",
              "legendFormat": "{{destination_version}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error Rate (5xx)",
          "description": "Total 5xx fraction (app counter) plus per-version 5xx fraction (Istio). Green = 0%, red threshold at 1%. A spike on v2 but not v1 signals a canary regression.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.01 }
                ]
              }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{job=\"$job\", status=~\"5..\"}[1m])) / sum(rate(http_requests_total{job=\"$job\"}[1m]))",
              "legendFormat": "total"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (destination_version) (rate(istio_requests_total{reporter=\"destination\", destination_app=\"users-api\", response_code=~\"5..\", destination_version=~\"$version\"}[1m])) / sum by (destination_version) (rate(istio_requests_total{reporter=\"destination\", destination_app=\"users-api\", destination_version=~\"$version\"}[1m]))",
              "legendFormat": "{{destination_version}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency Percentiles (p50 / p95 / p99)",
          "description": "p50/p95/p99 from the app histogram, plus per-version p95 from the Istio sidecar (converted ms→s). Higher p95 on v2 = the canary is slower.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"$job\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"$job\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"$job\"}[5m])))",
              "legendFormat": "p99"
            },
            {
              "refId": "D",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (destination_version, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_app=\"users-api\", destination_version=~\"$version\"}[5m]))) / 1000",
              "legendFormat": "p95 {{destination_version}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Node.js Heap",
          "description": "heap used trending toward heap total means a potential memory leak.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "nodejs_heap_used_bytes{job=\"$job\"}",
              "legendFormat": "heap used"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "nodejs_heap_size_total_bytes{job=\"$job\"}",
              "legendFormat": "heap total"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "gRPC Call Rate",
          "description": "Calls per second by method. Only populated for notify-api.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (method) (rate(grpc_requests_total{job=\"$job\"}[1m]))",
              "legendFormat": "{{method}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "gRPC Error Rate (non-OK)",
          "description": "Fraction of gRPC calls that returned a non-OK status code. Only populated for notify-api.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.01 }
                ]
              }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(grpc_requests_total{job=\"$job\", code!=\"OK\"}[1m])) / sum(rate(grpc_requests_total{job=\"$job\"}[1m]))",
              "legendFormat": "error %"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "gRPC Latency Percentiles (p50 / p95 / p99)",
          "description": "Only populated for notify-api.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(grpc_request_duration_seconds_bucket{job=\"$job\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(grpc_request_duration_seconds_bucket{job=\"$job\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(grpc_request_duration_seconds_bucket{job=\"$job\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod Restarts",
          "description": "Nonzero and climbing = crash loop. Check logs for the previous container.",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kube_pod_container_restarts_total{container=\"$job\", namespace=\"default\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Event Loop Lag",
          "description": "Time a callback waits before running. >50ms means the loop is saturated by sync work.",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.05 },
                  { "color": "red", "value": 0.2 }
                ]
              }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "nodejs_eventloop_lag_seconds{job=\"$job\"}",
              "legendFormat": "lag"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Container CPU",
          "description": "CPU cores consumed per pod. HPA fires when average crosses the target (s13).",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{container=\"$job\", namespace=\"default\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
