apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: users-api
  namespace: default
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: users-api
  rules:
    - backendRefs:
        - name: users-api-v1
          port: 3000
          weight: 90
        - name: users-api-v2
          port: 3000
          weight: 10
      retries:
        attempts: 2
        backoff: 1s
      timeouts:
        request: 5s