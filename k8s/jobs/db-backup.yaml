apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: default
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: db-backup
          annotations:
            proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:18
              command:
                - bash
                - -c
                - |
                  set -eo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
                  pg_dump "$DATABASE_URL" | gzip > "/backups/backup-${TIMESTAMP}.sql.gz"
                  echo "Backup written to /backups/backup-${TIMESTAMP}.sql.gz"
                  ls -lh /backups/
                  exec 3<>/dev/tcp/localhost/15020 && printf 'POST /quitquitquit HTTP/1.1\r\nHost: localhost\r\nContent-Length: 0\r\n\r\n' >&3 && cat <&3 && exec 3>&- || true
              env:
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: users-api-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: users-api-secret
                      key: DB_PASSWORD
                - name: DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: users-api-config
                      key: DB_HOST
                - name: DB_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: users-api-config
                      key: DB_PORT
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: users-api-config
                      key: DB_NAME
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: db-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi