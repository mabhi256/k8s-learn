apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: db-seed
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: postgres:16
          command:
            - sh
            - -c
            - |
              psql "$DATABASE_URL" <<'SQL'
              INSERT INTO users (name, email)
              VALUES
                ('Alice', 'alice@example.com'),
                ('Bob', 'bob@example.com'),
                ('Charlie', 'charlie@example.com')
              ON CONFLICT (email) DO NOTHING;
              SQL
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: users-api-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-api-secret
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-rw:5432/appdb"