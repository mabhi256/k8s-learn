apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: users-api
  namespace: default
spec:
  host: users-api
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2