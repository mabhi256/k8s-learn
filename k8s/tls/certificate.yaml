apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-local-tls
  namespace: default
spec:
  secretName: demo-local-tls
  duration: 2160h           # 90 days
  renewBefore: 360h         # 15 days
  dnsNames:
    - demo.local
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
