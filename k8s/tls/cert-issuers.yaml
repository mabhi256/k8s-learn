# 1. Bootstrap issuer: its only job is to sign the root once.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
# 2. The Root CA Certificate. Lives in cert-manager namespace because
#    a CA ClusterIssuer can only read secrets from the same namespace
#    as cert-manager itself.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: demo-root-ca
  duration: 87600h          # ~10 years
  renewBefore: 720h         # 30 days
  secretName: demo-root-ca-tls
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
# 3. The CA issuer every workload cert uses from now on.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: demo-root-ca-tls
