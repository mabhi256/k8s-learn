apiVersion: autoscaling/v2   # built-in Kubernetes API
kind: HorizontalPodAutoscaler
metadata:
  name: users-api
  labels:
    app: users-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: users-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # s13: scale on RPS via prometheus-adapter custom metric
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "10"
    # s10 CPU/memory fallback — uncomment to trigger the VPA+HPA feedback loop (see s13 §2)
    # - type: Resource
    #   resource:
    #     name: cpu
    #     target:
    #       type: Utilization
    #       averageUtilization: 50
    # - type: Resource
    #   resource:
    #     name: memory
    #     target:
    #       type: Utilization
    #       averageUtilization: 70