apiVersion: autoscaling/v2   # built-in Kubernetes API
kind: HorizontalPodAutoscaler
metadata:
  name: users-api
  labels:
    app: users-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: users-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # scale when either crosses threshold
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70