apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: users-api
  namespace: default
spec:
  scaleTargetRef:
    name: users-api
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prom-kube-prometheus-stack-prometheus.lgtm.svc:9090
        query: sum(rate(http_requests_total{namespace="default",service="users-api"}[2m]))
        threshold: "10"
        activationThreshold: "1"
    - type: cron
      metadata:
        timezone: "UTC"
        start: "0 8 * * 1-5"
        end: "0 18 * * 1-5"
        desiredReplicas: "3"
