apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  labels:
    app: users-api
spec:
  selector:
    matchLabels:
      app: users-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: users-api
    spec:
      serviceAccountName: users-api
      containers:
      - name: users-api
        image: users-api:local-v1
        imagePullPolicy: Never
        ports:
          - containerPort: 3000
        envFrom:
          - configMapRef:
              name: users-api-config
          - secretRef:
              name: users-api-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "250m"
            memory: "256Mi"
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /live
            port: 3000
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]
