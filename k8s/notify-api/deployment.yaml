apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-api
  labels:
    app: notify-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notify-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: notify-api
    spec:
      serviceAccountName: notify-api
      containers:
      - name: notify-api
        image: notify-api:local-v2
        imagePullPolicy: Never
        ports:
          - containerPort: 50051
          - containerPort: 9091
            name: metrics
        envFrom:
          - configMapRef:
              name: notify-api-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: "100m"
            memory: "128Mi"
        startupProbe:
          tcpSocket:
            port: 50051
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 50051
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 50051
          periodSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]
