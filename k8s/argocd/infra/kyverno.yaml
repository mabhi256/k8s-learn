apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://github.com/mabhi256/k8s-learn.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: "3.*"
      helm:
        valueFiles:
          - $values/helm/values/kyverno.values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
