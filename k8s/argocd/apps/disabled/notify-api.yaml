apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notify-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/mabhi256/k8s-learn.git
    targetRevision: HEAD
    path: helm/notify-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true